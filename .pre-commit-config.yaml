repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: sh scripts/run-uv run --locked isort --settings-file=./pyproject.toml
        language: system
        types: [python]
        require_serial: true
      - id: black
        name: black
        entry: sh scripts/run-uv run --locked black --config=./pyproject.toml
        language: system
        types: [python]
        require_serial: true
      - id: flake8
        name: flake8
        entry: sh scripts/run-uv run --locked flake8 --config=./.flake8
        language: system
        types: [python]
        require_serial: true
      - id: pylint
        name: pylint
        entry: sh scripts/run-uv run --locked pylint --rcfile=./.pylintrc
        language: system
        types: [python]
        require_serial: true
